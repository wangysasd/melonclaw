# MelonClaw Web 反向代理：Nginx 监听 80，转发到本地 uvicorn(127.0.0.1:8000)。
# SSE 相关设置（proxy_buffering off / 长 read timeout）是聊天流式输出的必要条件。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;

    # 公网部署建议开启基础认证：安装脚本检测到 BASIC_AUTH_USER/BASIC_AUTH_PASSWORD 时会自动启用
    #auth_basic "MelonClaw";
    #auth_basic_user_file /etc/nginx/.melonclaw_htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
