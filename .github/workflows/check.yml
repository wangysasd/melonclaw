name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖
        run: uv sync --locked
      - name: 编译检查
        run: uv run python -m compileall -q src
      - name: 测试（含架构依赖与文档链接校验）
        run: uv run pytest -q tests
      - name: Lint
        run: uv run ruff check src tests
      - name: 锁文件一致性
        run: uv lock --check
      - name: 空白错误
        run: git diff --check

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: 类型检查
        run: npm run typecheck
      - name: 测试
        run: npm test
