<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F8FAF6" />
    <meta name="description" content="MelonClaw 瓜爪助手：查资料、理思路、做计划。" />
    <link rel="icon" type="image/png" sizes="48x48" href="/static/assets/brand/favicon-48.png" />
    <title>MelonClaw · 瓜爪助手</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260907-11" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

      <aside id="sidebar" class="sidebar" aria-label="项目与会话导航">
        <div class="brand-row">
          <div class="brand">
            <div class="brand-mark">
              <img src="/static/assets/brand/melonclaw-mark.png" alt="" />
            </div>
            <div class="brand-copy">
              <div class="brand-name">MelonClaw</div>
              <div class="brand-subtitle">瓜爪助手</div>
            </div>
          </div>
          <button id="sidebar-collapse" class="icon-button sidebar-collapse" type="button" aria-label="收起侧栏" title="收起侧栏">
            <span class="icon" data-icon="chevron-left" aria-hidden="true"></span>
          </button>
          <button id="sidebar-close" class="icon-button sidebar-close" type="button" aria-label="关闭导航" title="关闭导航">
            <span class="icon" data-icon="x" aria-hidden="true"></span>
          </button>
        </div>

        <button id="new-session" class="new-session" type="button">
          <span class="icon" data-icon="plus" aria-hidden="true"></span>
          <span class="new-session-label">新建对话</span>
          <span class="shortcut">⌘ K</span>
        </button>

        <div class="sidebar-scroll">
          <section class="project-section" aria-labelledby="project-heading">
            <div class="section-heading">
              <div id="project-heading" class="section-label">项目</div>
              <button id="new-project" class="new-project" type="button" title="新增项目">
                <span class="icon" data-icon="plus" aria-hidden="true"></span>
                <span>新增项目</span>
              </button>
            </div>
            <div id="project-list" class="project-list"></div>
          </section>

          <section id="conversation-section" class="conversation-section" aria-labelledby="conversation-heading" hidden>
            <div class="conversation-heading">
              <div id="conversation-heading" class="section-label">当前项目</div>
              <div id="current-project-name" class="current-project-name">未选择项目</div>
            </div>
            <div id="conversation-list" class="conversation-list"></div>
            <button id="load-more" class="load-more" type="button" hidden>加载更多会话</button>
          </section>
        </div>

        <div class="sidebar-footer">
          <div class="user-picker">
            <label for="user-select">模拟用户</label>
            <div class="user-select-wrap">
              <button
                id="user-select"
                class="user-select-trigger"
                type="button"
                aria-label="选择模拟用户"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="user-options"
              >
                <span class="user-trigger-copy">
                  <span id="user-avatar" class="user-avatar small" aria-hidden="true">?</span>
                  <span id="user-select-value">正在加载用户…</span>
                </span>
                <span class="icon" data-icon="chevron-down" aria-hidden="true"></span>
              </button>
              <div id="user-options" class="user-options" role="listbox" hidden></div>
            </div>
          </div>

          <details class="runtime-details">
            <summary class="runtime-summary">
              <span class="icon" data-icon="shield-check" aria-hidden="true"></span>
              <span>运行详情</span>
              <span class="icon runtime-chevron" data-icon="chevron-right" aria-hidden="true"></span>
            </summary>
            <div class="runtime-card">
              <div class="runtime-line">
                <span id="status-dot" class="status-dot is-loading"></span>
                <span id="status-text">正在启动助手</span>
              </div>
              <div id="model-text" class="runtime-model">连接配置读取中…</div>
              <div id="mcp-text" class="runtime-detail">综合能力连接中</div>
            </div>
          </details>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="topbar-leading">
            <button id="mobile-menu" class="icon-button mobile-menu" type="button" aria-label="打开项目与会话导航" title="打开导航">
              <span class="icon" data-icon="menu" aria-hidden="true"></span>
            </button>
            <div>
              <div class="topbar-brand">MelonClaw</div>
              <div class="topbar-context">瓜爪助手 · <span id="topbar-project">未选择项目</span></div>
            </div>
          </div>
          <div class="topbar-meta">
            <span id="session-label" class="session-label">准备开始</span>
            <span id="run-status-pill" class="run-status-pill" data-status="starting">
              <span id="run-status-icon" class="icon" data-icon="loader-circle" aria-hidden="true"></span>
              <span id="run-status-text">连接中</span>
            </span>
          </div>
        </header>

        <section id="conversation" class="conversation" aria-label="聊天记录">
          <div id="welcome" class="welcome">
            <div class="welcome-mark"><img src="/static/assets/brand/melonclaw-mark.png" alt="" /></div>
            <div class="welcome-kicker">你好，我是 MelonClaw</div>
            <h1>今天，有什么想一起搞定的？</h1>
            <p class="welcome-copy">查资料、理思路、做计划，瓜爪来帮你。</p>
            <div class="prompt-grid">
              <button class="prompt-card" type="button" data-prompt="请比较两个技术方案的优缺点，并给出适用场景和推荐结论。">
                <span class="prompt-icon icon" data-icon="search" aria-hidden="true"></span>
                <span><strong>查找资料</strong><small>比较方案，梳理可靠信息</small></span>
                <span class="prompt-arrow icon" data-icon="chevron-right" aria-hidden="true"></span>
              </button>
              <button class="prompt-card" type="button" data-prompt="请把下面这段内容整理成清晰的要点清单，并标出待确认的问题。">
                <span class="prompt-icon icon" data-icon="list-checks" aria-hidden="true"></span>
                <span><strong>整理思路</strong><small>把杂乱内容变成行动清单</small></span>
                <span class="prompt-arrow icon" data-icon="chevron-right" aria-hidden="true"></span>
              </button>
              <button class="prompt-card" type="button" data-prompt="请根据我的目标制定一周学习计划，安排每天的重点、时间和复盘方式。">
                <span class="prompt-icon icon" data-icon="calendar-days" aria-hidden="true"></span>
                <span><strong>制定计划</strong><small>拆解目标，安排节奏与下一步</small></span>
                <span class="prompt-arrow icon" data-icon="chevron-right" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </section>

        <div id="sr-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
        <div id="approval-slot"></div>

        <div class="composer-wrap">
          <form id="composer" class="composer">
            <textarea id="message-input" rows="1" placeholder="输入你想聊的事情…" aria-label="输入内容"></textarea>
            <div class="composer-bottom">
              <button id="send-button" class="send-button" type="submit" disabled>
                <span id="send-label">发送</span>
                <span class="send-arrow icon" data-icon="arrow-up" aria-hidden="true"></span>
              </button>
            </div>
          </form>
          <div class="composer-meta">
            <div class="composer-hint"><span class="icon" data-icon="message-circle" aria-hidden="true"></span> Enter 发送 · Shift + Enter 换行</div>
            <div class="composer-footnote">AI生成内容仅供参考。</div>
          </div>
        </div>
      </main>
    </div>

    <dialog id="project-dialog" class="project-dialog" aria-labelledby="project-dialog-title">
      <form id="project-dialog-form" method="dialog">
        <div class="dialog-header">
          <div>
            <div class="dialog-kicker">工作空间</div>
            <h2 id="project-dialog-title">新增项目</h2>
          </div>
          <button id="project-dialog-close" class="icon-button" type="button" aria-label="关闭新增项目" title="关闭">
            <span class="icon" data-icon="x" aria-hidden="true"></span>
          </button>
        </div>
        <label class="dialog-label" for="project-name-input">项目名称</label>
        <input id="project-name-input" class="dialog-input" name="name" maxlength="120" autocomplete="off" placeholder="例如：春季工作计划" required />
        <div id="project-dialog-error" class="dialog-error" role="alert" hidden></div>
        <div class="dialog-actions">
          <button id="project-dialog-cancel" class="button-secondary" type="button">取消</button>
          <button id="project-dialog-submit" class="button-primary" type="submit">创建项目</button>
        </div>
      </form>
    </dialog>

    <script src="/static/app.js?v=20260907-11" defer></script>
  </body>
</html>
