[project]
name = "melonclaw"
version = "0.1.0"
description = "基于 Deep Agents 的通用 AI 助手"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents==0.7.5",
    "fastmcp==3.4.6",
    "langchain==1.3.14",
    "langchain-anthropic==1.5.4",
    "langchain-core==1.5.3",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.4.2",
    "langsmith==0.10.17",
    "python-dotenv==1.2.2",
    "fastapi==0.141.1",
    "tavily-python==0.7.27",
    "uvicorn==0.52.1",
    "sqlalchemy==2.0.52",
    "asyncpg==0.30.0",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.5",
    "greenlet==3.2.4",
    "langchain-quickjs==0.3.5",
    "pyyaml==6.0.3",
]

[project.scripts]
melonclaw-web = "melonclaw.main_web:main"
melonclaw-db-init = "melonclaw.main_db_init:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/melonclaw"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# 显式钉住规则集：否则 lint 结果会随 ruff 版本的默认值变化（0.16 的默认集比旧版更宽，
# 会让检查突然失败）。
# E4/E7/E9/F 是经典安全集，I 是导入顺序（23 个文件已整理）。
# TRY（7 处）与 BLE（1 处）尚未启用，告警清单见
# docs/exec-plans/tech-debt-tracker.md 的 D3。
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
