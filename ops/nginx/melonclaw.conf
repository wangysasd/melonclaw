# 安装到 nginx 的站点配置目录。生产域名 melonclaw.cn。
# 本文件是 HTTP 引导配置：80 提供 SPA 与 /api/ 反代，供 DNS 生效后用
# certbot --nginx -d melonclaw.cn --redirect 申请 Let's Encrypt 证书。
#
# 签发后的目标行为（不要再用本文件覆盖已由 certbot 改写的站点）：
# - listen 80 / server_name melonclaw.cn：HTTP 可达，整站 301 到
#   https://$host$request_uri；保留 /.well-known/acme-challenge/ 供续期。
# - listen 443 ssl：同一套 root、/api/ 反代与 SPA try_files；
#   证书 /etc/letsencrypt/live/melonclaw.cn/{fullchain,privkey}.pem。
# MELONCLAW_ALLOWED_ORIGINS 填 https://melonclaw.cn（无路径）。
# 若配置了 IPv6 AAAA，再为对应 server 增加 listen [::]:80 / [::]:443 ssl。

server {
    listen 80;
    server_name melonclaw.cn;
    root /opt/melonclaw/frontend/dist;
    index index.html;
    client_max_body_size 55m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
