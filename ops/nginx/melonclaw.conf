# 生产站点 melonclaw.cn 与 www.melonclaw.cn。安装到 /etc/nginx/sites-available/melonclaw 后启用并 reload。
# 两个主机名都进入同一网站：
# - 80：保留 /.well-known/acme-challenge/ 供证书续期，其余请求 301 到同一主机名的 HTTPS。
# - 443：托管 /opt/melonclaw/frontend/dist，并把 /api/ 反代到 127.0.0.1:8000。
# 证书必须已在 /etc/letsencrypt/live/melonclaw.cn/，且同时覆盖这两个主机名，否则 nginx -t 失败或 www 报证书错误。
# 页面通过同源 /api/ 访问后端，MELONCLAW_ALLOWED_ORIGINS 仍填 https://melonclaw.cn。
# 配置了 IPv6 AAAA 时，再为两个 server 增加 listen [::]:80 与 listen [::]:443 ssl。

server {
    listen 80;
    server_name melonclaw.cn www.melonclaw.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name melonclaw.cn www.melonclaw.cn;

    ssl_certificate /etc/letsencrypt/live/melonclaw.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melonclaw.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MelonClawSSL:10m;
    ssl_session_tickets off;

    root /opt/melonclaw/frontend/dist;
    index index.html;
    client_max_body_size 55m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
